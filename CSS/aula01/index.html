<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cascadin Stylesheet</title>
    <!-- CSS embedded (embutido) -->
    <style>
        p{
            font-size: 100px;

        }

             #gato{
                color: chartreuse;
             }
            #Totó{
                color: maroon;
            }
            
    </style>
</head>
<body>
  
    <!-- CSS inline é aquele que vai dentro da própria tag -->
<p style="color: rebeccapurple; font-size: 200px;">Matheus</p>
<p id="Totó">Totó</p>
<p id="gato">Sr ron ron</p>
</body>
</html>
