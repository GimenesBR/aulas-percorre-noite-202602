<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario 2 Radio e CheckBox</title>
</head>
<body>
    <header>

    </header>
    <main>
        <form action="">
            <label for="">Insira seu e-mail:</label>
            <input type="email" name="email" id="email" required="true" placeholder="exemplo@gmail.com">

            <label for="">Insira seu nome:</label>
            <input type="text" name="nome" id="nome" required="true" maxlength="30" placeholder="Matheus">

            <br>

            <label for="color">Escolha uma cor:</label>
            <input type="color" name="color" id="color">

            <br>

            <br><label for="">Avalie o atendimento! <br></label>
            <input type="radio" name="estrelas" id="3estrelas" value="3">
            <label for="3estrelas">⭐⭐⭐</label>
            <br>

            <input type="radio" name="estrelas" id="2estrelas" value="2">
            <label for="2estrelas">⭐⭐</label>
            <br>

            <input type="radio" name="estrelas" id="1estrela" value="1">
            <label for="1estrela">⭐</label>
            <br>

            <br><label for="">Deixe um comentário!</label><br>
            <textarea name="" id="comentário cols="20" rows="3" placeholder="Seu comentário"></textarea>

            <br><input type="submit" value="Enviar!">
        </form>
    </main>
    <footer>

    </footer>
</body>
</html>
